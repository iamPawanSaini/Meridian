# mypy configuration (T04a, decision D-2). Strict mode is applied per invocation, not here:
# the pre-commit hook runs `mypy --strict --python-version 3.10` on scripts/ and .claude/hooks/,
# and the engine sets `strict = true` in its own pyproject.toml (T13). Per-module `strict` is
# not relied on (unverified in the mypy documentation).
[mypy]
python_version = 3.10
warn_unused_configs = True
pretty = True
# Lets a partial run (the hook gets only the staged files) resolve the sibling modules the
# tests import, such as check_ci and _helpers.
mypy_path = scripts:scripts/tests
