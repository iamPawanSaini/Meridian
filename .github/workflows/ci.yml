# Meridian CI (T08, plan KD-8). Runs scripts/quality.sh natively on the runner, one group per
# job; scripts/quality.sh is the only implementation of the checks, so this file holds no check
# logic (decision-native-quality.md). scripts/check_ci.py keeps the groups, the toolchain
# versions, the action pins and the secret names in step with the repository.
# The required status check for the main branch is ci-ok (docs/runbooks/ci-secrets.md,
# .github/README.md). This workflow uses no secrets: only the read-only GITHUB_TOKEN.
name: Meridian CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QUALITY_RUNNER: native
    steps:
      - name: Check out the full history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        id: python
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Cache pre-commit environments
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: "pre-commit-${{ runner.os }}-${{ steps.python.outputs.python-version }}-\
            ${{ hashFiles('.pre-commit-config.yaml', 'scripts/tool-versions.env') }}"
      - name: Cache pinned tools
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .tools
            !.tools/reports
            !.tools/suite-bin
          key: "tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.env') }}"
      - name: Install the pinned tools
        shell: bash
        run: scripts/bootstrap-dev.sh
      - name: Run the quality suite (group core)
        shell: bash
        run: |
          mkdir -p .tools/reports
          scripts/quality.sh --group core 2>&1 | tee .tools/reports/quality-core.txt
      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-core
          path: |
            .tools/reports/
            services/engine/junit.xml
            services/engine/coverage.xml
            apps/drupal/junit.xml
            apps/drupal/coverage.xml
            apps/web/junit.xml
            apps/web/coverage/cobertura-coverage.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QUALITY_RUNNER: native
      QUALITY_DOCS_JOBS: 4
    steps:
      - name: Check out the full history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        id: python
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Cache pre-commit environments
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: "pre-commit-${{ runner.os }}-${{ steps.python.outputs.python-version }}-\
            ${{ hashFiles('.pre-commit-config.yaml', 'scripts/tool-versions.env') }}"
      - name: Cache pinned tools
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .tools
            !.tools/reports
            !.tools/suite-bin
          key: "tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.env') }}"
      - name: Install the Python packages the docs suites import
        shell: bash
        run: python -m pip install --no-input -r scripts/requirements-docs-tests.txt
      - name: Install the pinned tools
        shell: bash
        run: scripts/bootstrap-dev.sh
      - name: Run the quality suite (group docs)
        shell: bash
        run: |
          mkdir -p .tools/reports
          scripts/quality.sh --group docs 2>&1 | tee .tools/reports/quality-docs.txt
      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-docs
          path: |
            .tools/reports/
            services/engine/junit.xml
            services/engine/coverage.xml
            apps/drupal/junit.xml
            apps/drupal/coverage.xml
            apps/web/junit.xml
            apps/web/coverage/cobertura-coverage.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  drupal:
    name: drupal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QUALITY_RUNNER: native
      # T09: the Kernel tests run on MariaDB, the engine of the local stack and Pantheon (never
      # SQLite). The value is a throwaway for the ephemeral service container below, not a secret.
      SIMPLETEST_DB: mysql://root:ci-only@127.0.0.1:3306/meridian_test
    services:
      mariadb:
        # The tag matches the local MariaDB 10.6 and pantheon.yml (scripts/check_ci.py rule 2).
        image: mariadb:10.6.22
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: meridian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out the full history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP and Composer
        # shivammathur/setup-php 2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          tools: composer:2.11.1
          extensions: gd, pdo_mysql
          coverage: pcov
      - name: Record the toolchain
        shell: bash
        run: |
          php -v
          php -m | grep -i pcov
          composer --version
      - name: Find the Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >>"$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/drupal/composer.lock') }}
      - name: Run the quality suite (group drupal)
        shell: bash
        run: |
          mkdir -p .tools/reports
          scripts/quality.sh --group drupal 2>&1 | tee .tools/reports/quality-drupal.txt
      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-drupal
          path: |
            .tools/reports/
            services/engine/junit.xml
            services/engine/coverage.xml
            apps/drupal/junit.xml
            apps/drupal/coverage.xml
            apps/web/junit.xml
            apps/web/coverage/cobertura-coverage.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  engine:
    name: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QUALITY_RUNNER: native
    steps:
      - name: Check out the full history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the quality suite (group engine)
        shell: bash
        run: |
          mkdir -p .tools/reports
          scripts/quality.sh --group engine 2>&1 | tee .tools/reports/quality-engine.txt
      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-engine
          path: |
            .tools/reports/
            services/engine/junit.xml
            services/engine/coverage.xml
            apps/drupal/junit.xml
            apps/drupal/coverage.xml
            apps/web/junit.xml
            apps/web/coverage/cobertura-coverage.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QUALITY_RUNNER: native
    steps:
      - name: Check out the full history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the quality suite (group web)
        shell: bash
        run: |
          mkdir -p .tools/reports
          scripts/quality.sh --group web 2>&1 | tee .tools/reports/quality-web.txt
      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-web
          path: |
            .tools/reports/
            services/engine/junit.xml
            services/engine/coverage.xml
            apps/drupal/junit.xml
            apps/drupal/coverage.xml
            apps/web/junit.xml
            apps/web/coverage/cobertura-coverage.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  ci-ok:
    name: ci-ok
    needs: [core, docs, drupal, engine, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a needed job did not succeed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        shell: bash
        run: |
          echo "A needed job did not succeed. See the failing job."
          exit 1
      - name: All jobs succeeded
        shell: bash
        run: echo "ci-ok"
