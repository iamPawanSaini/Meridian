# T06: meridian-web, the Node 22 runtime for the Next.js dashboard, served at
# https://meridian.ddev.site:3001 (router port 3001 to container port 3000). Until T21 adds
# apps/web/package.json, start.sh serves a placeholder. T21 owns the dev branch of start.sh.
services:
  meridian-web:
    container_name: ddev-${DDEV_SITENAME}-meridian-web
    image: node:22.23.4-trixie-slim@sha256:2117f713a417f3aff682ac8f5bc2ebbdf1beed51f36e67ab1e0fd3866b6d2d8f
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    env_file:
      - ${DDEV_APPROOT}/.env.example
      - path: ${DDEV_APPROOT}/.env
        required: false
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      NODE_EXTRA_CA_CERTS: /mnt/ddev-global-cache/mkcert/rootCA.pem
      VIRTUAL_HOST: meridian.ddev.site
      HTTPS_EXPOSE: 3001:3000
    user: ${DDEV_UID}:${DDEV_GID}
    init: true
    working_dir: /var/www/html/apps/web
    command: ["/var/www/html/.ddev/meridian-web/start.sh"]
    external_links:
      - ddev-router:meridian.ddev.site
    volumes:
      - ${DDEV_APPROOT}:/var/www/html
      - ddev-global-cache:/mnt/ddev-global-cache:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/')
          .then((r) => process.exit(r.status < 500 ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  ddev-global-cache:
    external: true
    name: ddev-global-cache
